# GitHub Action workflow to build and run pymd-fmt's tests
#

name: Test Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - .gitignore
      - README.md
      - EXAMPLES.md
      - LICENSE
      - .github/workflows/build_and_test.yml
      - .github/workflows/build_and_publish.yml

  pull_request:
    branches: [ main ]
    paths-ignore:
      - .gitignore
      - README.md
      - EXAMPLES.md
      - LICENSE
      - .github/workflows/build_and_test.yml
      - .github/workflows/build_and_publish.yml

jobs:
  lint:
    name: Check syntax errors and warnings
    runs-on: ubuntu-latest
    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name !=
      github.repository

    steps:
      - name: Checkout pymd-fmt
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Check lint errors
        run: |
          ruff check .

      - name: Check formatting
        run: |
          ruff format --check .

  test:
    name: Run unit tests and build artifact
    needs: lint
    runs-on: ${{ matrix.os }}
    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name !=
      github.repository

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        experimental: [false]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - python-version: "3.13"
            experimental: true
            os: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout pymd-fmt
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev] build

      - name: Run unit tests
        run: |
          pytest -s

      - name: Build artifact
        run: |
          python -m build

  publish:
    name: Publish on Test Environment
    needs: test
    runs-on: ubuntu-latest
    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name !=
      github.repository

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        experimental: [false]
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout pymd-fmt
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Get latest tag
        id: latest_tag
        uses: actions-ecosystem/action-get-latest-tag@v1
        with:
          semver_only: true

      - name: Change package version
        run: |
          VER=$(echo "${{ steps.latest_tag.outputs.tag }}" | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}')
          if [ -z "$VER" ]; then
            VER="0.0.0"
          fi
          BUILDDT=$(date '+%Y%m%d%H%M%S')
          NEWVER="${VER}.dev${BUILDDT}"
          sed -i "s/^version = .*/version = \"${NEWVER}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${NEWVER}\"/" src/pymd_fmt/__init__.py

      - name: Build artifact
        run: |
          python -m build

      - name: Publish package in Test Environment
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.test_pypi_password }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
