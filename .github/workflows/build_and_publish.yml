# GitHub Action workflow to build and publish pymd-fmt on PyPI
#

name: PyPI Build pymd-fmt

on:
  release:
    types: [published]

jobs:
  lint:
    name: Check syntax errors and warnings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pymd-fmt
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Check lint errors
        run: |
          ruff check .

      - name: Check formatting
        run: |
          ruff format --check .

  build:
    name: Run unit tests and build artifact
    needs: lint
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        experimental: [false]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - python-version: "3.13"
            experimental: true
            os: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout pymd-fmt
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev] build

      - name: Run unit tests
        run: |
          pytest -s

      - name: Build artifact
        run: |
          python -m build

  publish:
    name: Publish on Live Environment
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        experimental: [false]
    continue-on-error: ${{ matrix.experimental }}

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Checkout pymd-fmt
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Change package version
        run: |
          VER=$(echo '${{ github.event.release.tag_name }}' | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}')
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" src/pymd_fmt/__init__.py

      - name: Build artifact
        run: |
          python -m build

      - name: Publish package in Live Environment
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.prod_pypi_password }}
