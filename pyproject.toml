[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymd-fmt"
version = "0.1.0"
description = "Parse Markdown and render it to HTML tags."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Helvio Junior", email = "helvio_junior@hotmail.com" }]
keywords = ["markdown", "html", "parser", "formatter", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/helviojunior/pymd-fmt"
Repository = "https://github.com/helviojunior/pymd-fmt"
Issues = "https://github.com/helviojunior/pymd-fmt/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pymd_fmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
